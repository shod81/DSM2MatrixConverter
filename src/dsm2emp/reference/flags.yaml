    type_name: "REG_DWORD"
    description: "32-Bit Ganzzahl (DWORD)"
    doc_ref: "RegFlags"
  - flag: "0x00000001"
    type_name: "REG_BINARY"
    description: "Binärwert"
    doc_ref: "RegFlags"
  - flag: "0x00020000"
    type_name: "REG_EXPAND_SZ"
    description: "Erweiterbare Zeichenkette (enthält Variablen)"
    doc_ref: "RegFlags"
