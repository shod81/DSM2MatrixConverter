# Empirum Setup.inf Flags-Referenz
# Basierend auf System_Prompt_Empirum_Setup.inf.md und Matrix42 Setup.inf-Dokumentation

section_flags:
  - name: "DONTDELETE"
    description: "Sektion wird nur bei Installation ausgeführt (bleibt bei Deinstallation unberührt)."
    doc_ref: "SectionFlags"
  - name: "DELETE"
    description: "Sektion wird nur bei Deinstallation ausgeführt."
    doc_ref: "SectionFlags"
  - name: "CLIENT"
    description: "Sektion wird im Benutzerkontext (/AW) ausgeführt."
    doc_ref: "SectionFlags"
  - name: "MACHINE"
    description: "Sektion wird im Computerkontext (SYSTEM) ausgeführt."
    doc_ref: "SectionFlags"
  - name: "WINDOWS32"
    description: "Sektion wird nur auf 32-Bit-Systemen ausgeführt."
    doc_ref: "SectionFlags"
  - name: "WINDOWS64"
    description: "Sektion wird nur auf 64-Bit-Systemen ausgeführt."
    doc_ref: "SectionFlags"
  - name: "ADMIN"
    description: "Sektion wird bei administrativer Installation ausgeführt."
    doc_ref: "SectionFlags"
  - name: "SHARED"
    description: "Gemeinsam genutzte Sektion."
    doc_ref: "SectionFlags"

copy_flags:
  - name: "ALWAYS"
    description: "Zieldatei immer überschreiben."
    doc_ref: "CopyFlags"
  - name: "NORMAL"
    description: "Standard-Kopierverhalten (überschreiben falls neuer oder nicht vorhanden)."
    doc_ref: "CopyFlags"
  - name: "REPLACEOLDER"
    description: "Nur überschreiben, wenn die Zieldatei älter ist."
    doc_ref: "CopyFlags"
  - name: "DONTREPLACE"
    description: "Niemals überschreiben, falls Zieldatei bereits existiert."
    doc_ref: "CopyFlags"
  - name: "DONTDELETE"
    description: "Datei bei der Deinstallation nicht löschen."
    doc_ref: "CopyFlags"
  - name: "DELETE"
    description: "Datei nur bei Deinstallation löschen."
    doc_ref: "CopyFlags"
  - name: "SHARED"
    description: "Nutzung des Windows SharedDLL-Zählers."
    doc_ref: "CopyFlags"
  - name: "OPTIONAL"
    description: "Kein Fehler, falls Quelldatei nicht existiert."
    doc_ref: "CopyFlags"
  - name: "USEFILENAME"
    description: "Dateinamen der Quelle beibehalten."
    doc_ref: "CopyFlags"
  - name: "DIRECTORY"
    description: "Zielangabe ist ein Verzeichnis."
    doc_ref: "CopyFlags"
  - name: "NOSIZEWARNING"
    description: "Keine Größenwarnung ausgeben."
    doc_ref: "CopyFlags"
  - name: "SETUP"
    description: "Kennzeichnet Setup-Runtime-Komponenten."
    doc_ref: "CopyFlags"
  - name: "WINDOWS32"
    description: "Nur auf 32-Bit-Systemen bzw. im 32-Bit-Kontext kopieren."
    doc_ref: "CopyFlags"
  - name: "WINDOWS64"
    description: "Nur auf 64-Bit-Systemen kopieren."
    doc_ref: "CopyFlags"
  - name: "REPLACEVARS"
    description: "Ersetzt Umgebungsvariablen im Inhalt der Zieldatei."
    doc_ref: "CopyFlags"
  - name: "CASCADED"
    description: "Verzeichnis bei Deinstallation kaskadierend löschen."
    doc_ref: "CopyFlags"
  - name: "SETUPHOOK"
    description: "Löst Hook-Funktion nach dem Kopieren aus."
    doc_ref: "CopyFlags"
  - name: "APPEND"
    description: "Inhalt an Zieldatei anhängen."
    doc_ref: "CopyFlags"
  - name: "REGISTER"
    description: "Registriert DLL/OCX im System."
    doc_ref: "CopyFlags"
  - name: "SHAREDDLL"
    description: "Verwendet Windows SharedDLL-Registrierung."
    doc_ref: "CopyFlags"
  - name: "UNPACK"
    description: "Dekomprimiert die Datei beim Kopieren."
    doc_ref: "CopyFlags"
  - name: "REGASM"
    description: "Registriert .NET-Assembly nach dem Kopieren."
    doc_ref: "CopyFlags"
  - name: "SYSTEM"
    description: "Kopiert mit System-Attribut."
    doc_ref: "CopyFlags"
  - name: "PROTECTED"
    description: "Schreibgeschützt kopieren."
    doc_ref: "CopyFlags"

reg_flags:
