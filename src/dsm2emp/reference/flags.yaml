    type_name: "REG_MULTI_SZ"
    description: "Mehrteilige Zeichenkette (Null-terminiert)"
    doc_ref: "RegFlags"
  - flag: "0x00040001"
    type_name: "REG_QWORD"
    description: "64-Bit Ganzzahl (QWORD)"
    doc_ref: "RegFlags"
  - flag: "0x00020001"
    type_name: "REG_NONE"
    description: "Kein Datentyp (REG_NONE)"
    doc_ref: "RegFlags"
  - flag: "0x10000001"
    type_name: "REG_BINARY_SZ"
    description: "Binäre Zeichenkette (REG_BINARY_SZ)"
    doc_ref: "RegFlags"
  - flag: "0x00000002"
    type_name: "DELETE"
    description: "Löscht den Schlüssel oder Wert"
    doc_ref: "RegFlags"
