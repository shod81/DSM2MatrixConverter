# Empirum Setup.inf Variablen-Referenz und DSM-Mapping
# Basierend auf der Matrix42 Empirum Setup.inf-Referenz (Variablen und DSM-Mapping)

empirum_variables:
  - name: "App"
    description: "Installationsverzeichnis der Anwendung (entspricht ApplicationDir)"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "Src"
    description: "Quellverzeichnis relativ zur Setup.inf (entspricht SrcDir)"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "ApplicationDir"
    description: "Zielverzeichnis für Anwendungs- und Skriptdateien"
    category: "Metadaten"
    doc_ref: "Application"
  - name: "SetupInfDir"
    description: "Unterverzeichnis der Setup.inf (üblicherweise 'Install')"
    category: "Metadaten"
    doc_ref: "Application"
  - name: "CommonSetupDir"
    description: "Verzeichnis der Empirum-Setup-Runtime (%CommonFilesDir%\\Setup%SetupBits%)"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "SetupBits"
    description: "Bit-Architektur der Setup.exe (leer bei 32-Bit, '64' bei 64-Bit)"
    category: "System"
    doc_ref: "Environment"
  - name: "Windows"
    description: "Windows-Hauptverzeichnis (z. B. C:\\Windows)"
    category: "System"
    doc_ref: "Environment"
  - name: "System"
    description: "Windows Systemverzeichnis (z. B. C:\\Windows\\System32)"
    category: "System"
    doc_ref: "Environment"
  - name: "ProgramFilesDir"
    description: "Programme-Verzeichnis für native Architektur"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "ProgramFilesDirx86"
    description: "32-Bit-Programme-Verzeichnis auf 64-Bit-Systemen"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "CommonFilesDir"
    description: "Gemeinsame Dateien-Verzeichnis"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "CommonFilesDirx86"
    description: "32-Bit-Gemeinsame-Dateien-Verzeichnis auf 64-Bit-Systemen"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "Temp"
    description: "Temporäres Verzeichnis des ausführenden Kontos"
    category: "System"
    doc_ref: "Environment"
  - name: "WindowsUser"
    description: "Name des aktuell angemeldeten Windows-Benutzers"
    category: "Benutzer"
    doc_ref: "Environment"
  - name: "ComputerName"
    description: "NetBIOS-Name des Computers"
    category: "System"
    doc_ref: "Environment"
  - name: "ErrorLevel"
    description: "Rückgabecode des letzten Call-Befehls"
    category: "Laufzeit"
    doc_ref: "Environment"
  - name: "EmpirumServer"
    description: "Name oder IP des zuständigen Empirum-Servers"
    category: "Empirum"
    doc_ref: "Environment"
  - name: "DomainName"
    description: "Name der Computer-Domäne"
    category: "Netzwerk"
    doc_ref: "Environment"
  - name: "CommonStartMenu"
    description: "Pfad zum öffentlichen Startmenü"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "CommonDesktop"
    description: "Pfad zum öffentlichen Desktop"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "CommonAppData"
    description: "Pfad zu ProgramData (C:\\ProgramData)"
    category: "Verzeichnisse"
    doc_ref: "Environment"
  - name: "Personal"
    description: "Persönlicher Dokumentenordner des Benutzers"
    category: "Benutzer"
    doc_ref: "Environment"

dsm_variable_mappings:
  - dsm: "%windir%"
    empirum: "%Windows%"
    id: "V-01"
  - dsm: "%systemroot%"
    empirum: "%Windows%"
    id: "V-01b"
  - dsm: "%winsysdir%"
    empirum: "%System%"
    id: "V-02"
  - dsm: "%systemdir%"
    empirum: "%System%"
    id: "V-02b"
  - dsm: "%programfiles%"
    empirum: "%ProgramFilesDir%"
    id: "V-03"
  - dsm: "%programfiles(x86)%"
    empirum: "%ProgramFilesDirx86%"
    id: "V-03b"
  - dsm: "%programfilesdirx86%"
    empirum: "%ProgramFilesDirx86%"
    id: "V-03c"
  - dsm: "%commonfiles%"
    empirum: "%CommonFilesDir%"
    id: "V-04"
  - dsm: "%commonprogramfilesdir%"
    empirum: "%CommonFilesDir%"
    id: "V-04b"
  - dsm: "%temp%"
    empirum: "%Temp%"
    id: "V-05"
  - dsm: "%tmp%"
    empirum: "%Temp%"
    id: "V-05b"
  - dsm: "%username%"
    empirum: "%WindowsUser%"
    id: "V-06"
  - dsm: "%computername%"
    empirum: "%ComputerName%"
    id: "V-07"
  - dsm: "%src%"
    empirum: "%Src%"
    id: "V-17"
  - dsm: "%sourcedir%"
    empirum: "%Src%"
    id: "V-17b"
  - dsm: "%dst%"
    empirum: "%App%"
    id: "V-18"
  - dsm: "%installdir%"
    empirum: "%App%"
    id: "V-18b"
  - dsm: "%targetdir%"
    empirum: "%App%"
    id: "V-18c"
  - dsm: "%programdata%"
    empirum: "%CommonAppData%"
    id: "V-19"
  - dsm: "%allusersprofile%"
    empirum: "%CommonAppData%"
    id: "V-19b"
  - dsm: "%allusersdesktop%"
    empirum: "%CommonDesktop%"
    id: "V-20"
  - dsm: "%allusersprograms%"
    empirum: "%CommonPrograms%"
    id: "V-21"
  - dsm: "%userdesktop%"
    empirum: "%Desktop%"
    id: "V-22"
  - dsm: "%exitcode%"
    empirum: "%ErrorLevel%"
    id: "V-23"
  - dsm: "%returncode%"
    empirum: "%ErrorLevel%"
    id: "V-23b"
  - dsm: "%userdomain%"
    empirum: "%DomainName%"
    id: "V-24"
  - dsm: "%packagename%"
    empirum: "%ProductName%"
    id: "V-25"
  - dsm: "%packagevendor%"
    empirum: "%DeveloperName%"
    id: "V-26"
  - dsm: "%packageversion%"
    empirum: "%Version%"
    id: "V-27"
