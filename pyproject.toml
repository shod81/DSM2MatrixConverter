[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsm2emp"
version = "1.0.0"
description = "Migration tool: Ivanti DSM packages to Matrix42 Empirum Setup.inf"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DSM2Empirum Development Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-qt>=4.4.0",
    "respx>=0.22.0",
    "types-jsonschema>=4.20.0",
    "pyinstaller>=6.0.0",
    "pypdf>=4.0.0",
]
gui = [
    "pyside6>=6.7.0",
]
ai = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
dsm2emp = "dsm2emp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsm2emp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
